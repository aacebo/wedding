name: wedding

services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: bins/api/Dockerfile
    ports:
      - 8080:8080
    environment:
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_RSVP_DATA_SOURCE_ID: ${NOTION_RSVP_DATA_SOURCE_ID:-41b96eec-0111-81c0-9318-000bf13b5594}
      NOTION_GUESTS_DATA_SOURCE_ID: ${NOTION_GUESTS_DATA_SOURCE_ID:-41b96eec-0111-81e1-a385-000bebe7a8ad}
      NOTION_GUESTS_PAGE_ID: ${NOTION_GUESTS_PAGE_ID:-41b96eec-0111-811a-b80b-fa7bb1979db2}
      NOTION_PROGRESS_WEBHOOK_SECRET: ${NOTION_PROGRESS_WEBHOOK_SECRET:-}
