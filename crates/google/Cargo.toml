[package]
name = "google"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm    = "0.10"
sha2       = "0.10"
rand       = "0.8"
base64     = "0.22"
thiserror  = "2"
url        = "2"
