services:
  - type: web
    name: wedding-api
    runtime: docker
    plan: standard
    region: virginia
    dockerfilePath: bins/api/Dockerfile
    dockerContext: .
    healthCheckPath: /welcome
    autoDeploy: true
    domains:
      - baicebo.com
      - www.baicebo.com
    envVars:
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_RSVP_DATA_SOURCE_ID
        value: 41b96eec-0111-81c0-9318-000bf13b5594
      - key: NOTION_PROGRESS_WEBHOOK_SECRET
        generateValue: true
