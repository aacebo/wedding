{% extends "base.html" %}

{% block content %}
<main id="main-content" class="contact-page">
    <header class="page-intro" data-reveal>
        <p class="page-kicker">Send us a note</p>
        <h1 class="page-title">Contact</h1>
        <p class="page-deck">We would love to hear from you.</p>
    </header>

    <section class="contact-card pet-hover-zone" data-reveal aria-label="Wedding contacts">
        <article class="contact-entry">
            <h2>The family</h2>
            <p><a class="editorial-link" href="mailto:baicebo.family@gmail.com">baicebo.family@gmail.com</a></p>
        </article>
        <div class="contact-pets" aria-hidden="true">
            <figure class="pet-cameo pet-cameo--cat" data-pet-cameo><img src="/assets/pets/heihei-contact.webp" alt="" loading="lazy"><figcaption class="pet-cameo__tag">HeiHei</figcaption></figure>
            <div class="contact-seal">N + A</div>
            <figure class="pet-cameo pet-cameo--dog" data-pet-cameo><img src="/assets/pets/marlow-contact.webp" alt="" loading="lazy"><figcaption class="pet-cameo__tag">Marlow</figcaption></figure>
        </div>
    </section>
</main>
{% endblock %}
