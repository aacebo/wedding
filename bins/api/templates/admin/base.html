<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Admin — Nancy &amp; Alexander{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <style>[x-cloak]{display:none !important;}</style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F7F1E6',
                        ink: '#1A1A1A',
                        accent: '#6B7253',
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'Georgia', 'serif'],
                        serif: ['"EB Garamond"', 'Georgia', 'serif'],
                    },
                },
            },
        };
    </script>
</head>
<body class="bg-cream text-ink font-serif min-h-screen">
    {# Admin surface has its own private nav — no public site links. #}
    <header class="border-b border-ink/10 bg-cream/80 backdrop-blur">
        <nav class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-4 px-6 py-4">
            <a href="/admin" class="font-display text-lg font-semibold tracking-wide">Planning Hub</a>
            <div class="flex items-center gap-x-6 font-display text-xs uppercase tracking-[0.2em]">
                <a href="/admin" class="text-ink/70 transition hover:text-accent">Dashboard</a>
                <a href="/admin/inbox" class="text-ink/70 transition hover:text-accent">Inbox</a>
                <a href="/admin/todos" class="text-ink/70 transition hover:text-accent">Todos</a>
                <a href="/admin/timeline" class="text-ink/70 transition hover:text-accent">Timeline</a>
                {% block adminnav %}{% endblock %}

                {# Notifications bell: badge polls every 60s; panel loads on open. #}
                <div x-data="{ open: false }" class="relative flex items-center normal-case tracking-normal">
                    <button type="button" @click="open = !open"
                            class="relative flex items-center text-ink/70 transition hover:text-accent"
                            aria-label="Reminders">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                             stroke-width="1.5" stroke="currentColor" class="h-5 w-5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
                        </svg>
                        <span id="notif-badge"
                              hx-get="/admin/notifications/count"
                              hx-trigger="load, every 60s"
                              hx-swap="outerHTML"></span>
                    </button>
                    <div x-show="open" x-cloak @click.outside="open = false"
                         class="absolute right-0 top-9 z-50 w-80 overflow-hidden rounded-lg border border-ink/10 bg-cream shadow-lg">
                        <div id="notif-panel-body"
                             hx-get="/admin/notifications" hx-trigger="load">
                            <p class="px-4 py-6 text-center text-sm text-ink/60">Loading…</p>
                        </div>
                    </div>
                </div>

                <button hx-post="/admin/logout" hx-on::after-request="window.location.href='/welcome'"
                        class="text-ink/50 transition hover:text-accent">Sign out</button>
            </div>
        </nav>
    </header>
    <main class="mx-auto max-w-5xl px-6 py-10">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
