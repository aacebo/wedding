<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1ebdd">
    <meta name="description" content="Nancy and Alexander's wedding celebration at Villa di Striano in Tuscany.">
    <title>{% block title %}Nancy &amp; Alexander{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=EB+Garamond:ital,wght@0,400;0,500;1,400&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/site.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <script defer src="/assets/site.js"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header" x-data="{ open: false }" @keydown.escape.window="open = false">
        <div class="masthead">
            <a class="masthead__brand" href="/welcome" aria-label="Nancy and Alexander — Home">
                <span class="masthead__names">Nancy &amp; Alexander</span>
                <span class="masthead__edition">The Wedding Edition</span>
            </a>
            <div class="masthead__details" aria-hidden="true">
                <span>19 June 2027</span>
                <span>Villa di Striano</span>
                <span>Tuscany, Italy</span>
            </div>
            <button class="nav-toggle" type="button" @click="open = !open" :aria-expanded="open.toString()" aria-controls="site-nav">
                <span class="nav-toggle__line"></span>
                <span class="nav-toggle__label" x-text="open ? 'Close' : 'Menu'">Menu</span>
                <span class="nav-toggle__line"></span>
            </button>
        </div>
        <nav id="site-nav" class="site-nav" :class="{ 'is-open': open }" aria-label="Primary navigation">
            <a href="/welcome" data-nav>Home</a>
            <a href="/story" data-nav>Our Story</a>
            <a href="/schedule" data-nav>Schedule</a>
            <a href="/travel" data-nav>Travel</a>
            <a href="/venue" data-nav>Venue</a>
            <a href="/contact" data-nav>Contact</a>
        </nav>
    </header>

    {% block content %}{% endblock %}

    <footer class="site-footer">
        <div class="site-footer__monogram">
            <span class="site-footer__paw" aria-hidden="true">•</span>
            <span>N + A</span>
            <span class="site-footer__paw" aria-hidden="true">•</span>
            <small>Nancy &amp; Alexander &middot; with HeiHei &amp; Marlow</small>
        </div>
        <p>19.06.27 &middot; Villa di Striano &middot; Tuscany</p>
    </footer>
</body>
</html>
